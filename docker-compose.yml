# Optional local Postgres. SQLite is equally acceptable.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: au
      POSTGRES_PASSWORD: au_local_only
      POSTGRES_DB: au_assignment
    ports:
      # Host PostgreSQL already uses 5432; expose this project on 5433.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
